# Settings that differ between the laptop (local) and AWS (prod).
# The pipeline code is identical in both; PIPELINE_ENV picks the section.
local:
  raw_dir: /home/hadoop/workspace/data/raw
  catalog:
    name: lake                            # tables are addressed as lake.<layer>.<table>
    type: hadoop                          # Iceberg keeps its table list in files in a local folder
    warehouse: /home/hadoop/workspace/lake
  source_db:
    host: sqlserver                       # the docker-compose service name
    port: 1433
    database: globalpartners
    trust_server_certificate: true        # local SQL Server uses a self-signed certificate
    user_env: MSSQL_USER                  # credentials come from environment variables (.env)
    password_env: MSSQL_SA_PASSWORD
    reader_user_env: MSSQL_ETL_USER
    reader_password_env: MSSQL_ETL_PASSWORD

prod:
  # ${NAME} values come from the Glue job parameters that the CDK PipelineStack sets
  # (e.g. --LAKE_BUCKET globalpartners-lake-...); see common/job_args.py.
  raw_dir: s3://${LAKE_BUCKET}/raw            # seed CSVs, uploaded by infra/up.sh
  catalog:
    name: lake
    type: glue                                # AWS Glue Data Catalog: databases bronze, silver, gold, ops
    warehouse: s3://${LAKE_BUCKET}/lake
  source_db:
    host: ${SOURCE_DB_HOST}                   # the RDS endpoint
    port: 1433
    database: globalpartners
    trust_server_certificate: true            # encrypted; certificate not verified (needs the RDS CA in a Java truststore)
    admin_secret: ${SOURCE_ADMIN_SECRET}      # AWS Secrets Manager: RDS master login (setup jobs only)
    reader_secret: ${SOURCE_READER_SECRET}    # AWS Secrets Manager: read-only etl_reader login
